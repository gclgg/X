name: Clean Logs & Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean large log files
        run: |
          # 排除 .git 目录，清空超过 20MB 的 .log 文件
          find . -path ./.git -prune -o -name "*.log" -type f -size +20M -exec sh -c ': > "$1"' _ {} \;
          find . -path ./.git -prune -o -name "url_changes.log" -type f -size +20M -exec sh -c ': > "$1"' _ {} \;

          # 配置 git 用户
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有日志文件变更，有则添加并提交
          if git status --porcelain | grep -q "\.log$"; then
            git add "*.log" "**/*.log"
            git commit -m "🧹 Auto-clean logs [skip ci]"
            git push
            echo "✅ Log files cleaned and pushed"
          else
            echo "✅ No log files to commit"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4.103.0

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 项目名称: gclgg/X"
          echo "🌿 分支: ${{ github.ref_name }}"
          wrangler pages deploy . --project-name="gclgg/X" --branch="${{ github.ref_name }}"
