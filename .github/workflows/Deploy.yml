name: Clean Logs & Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 git push

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保完整历史，便于后续push

      - name: Clean large log files
        run: |
          # 排除 .git 目录，清空超过 20MB 的 .log 文件
          find . -path ./.git -prune -o -name "*.log" -type f -size +20M -exec sh -c ': > "$1"' _ {} \;
          find . -path ./.git -prune -o -name "url_changes.log" -type f -size +20M -exec sh -c ': > "$1"' _ {} \;

          # 配置 git 用户
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只添加日志文件（避免意外提交其他修改）
          git add "*.log" "**/*.log"
          
          # 如果有变更则提交并推送
          if git diff --cached --quiet; then
            echo "✅ No log changes to commit"
          else
            git commit -m "🧹 Auto-clean logs [skip ci]"
            git push
            echo "✅ Log files cleaned and pushed"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4.103.0

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 项目名称: gclgg/X"
          echo "🌿 分支: ${{ github.ref_name }}"
          wrangler pages deploy . --project-name="gclgg/X" --branch="${{ github.ref_name }}"
