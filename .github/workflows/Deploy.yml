name: Auto Clean Logs & Deploy

on:
  push:
    branches: [main, master]
  schedule:
    # 每天凌晨 3 点自动清理
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_only:
        description: '仅清理日志，不部署'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20'

jobs:
  clean-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ========== 1. 检出代码 ==========
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== 2. 检查大文件 ==========
      - name: Check for oversized files
        id: check-files
        run: |
          echo "🔍 检查超过 20MB 的文件..."

          # 查找超过 20MB 的文件（留 5MB 余量）
          LARGE_FILES=$(find . -type f -size +20M             ! -path './.git/*'             ! -path './node_modules/*'             ! -path './.github/*' 2>/dev/null)

          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ 发现大文件："
            echo "$LARGE_FILES" | while read file; do
              size=$(du -h "$file" | cut -f1)
              echo "  - $file ($size)"
            done
            echo "has_large_files=true" >> $GITHUB_OUTPUT
            echo "large_files<<EOF" >> $GITHUB_OUTPUT
            echo "$LARGE_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "✅ 没有发现大文件"
            echo "has_large_files=false" >> $GITHUB_OUTPUT
          fi

      # ========== 3. 清理日志文件 ==========
      - name: Clean log files
        if: steps.check-files.outputs.has_large_files == 'true'
        run: |
          echo "🧹 开始清理日志文件..."

          # 定义要清理的日志模式
          LOG_PATTERNS=(
            "*.log"
            "live/*.log"
            "logs/*.log"
            "log/*.log"
            "tmp/*.log"
            "*.log.*"
            "url_changes.log"
            "access.log"
            "error.log"
            "debug.log"
          )

          total_freed=0

          for pattern in "${LOG_PATTERNS[@]}"; do
            if compgen -G "$pattern" > /dev/null 2>&1; then
              for file in $pattern; do
                if [ -f "$file" ]; then
                  size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
                  total_freed=$((total_freed + size))
                  echo "  🗑️ 删除: $file ($(numfmt --to=iec $size))"
                  rm -f "$file"
                fi
              done
            fi
          done

          # 清空仍在使用的日志文件（保留文件，清空内容）
          ACTIVE_LOGS=(
            "live/url_changes.log"
          )

          for logfile in "${ACTIVE_LOGS[@]}"; do
            if [ -f "$logfile" ]; then
              size=$(stat -f%z "$logfile" 2>/dev/null || stat -c%s "$logfile" 2>/dev/null || echo "0")
              if [ "$size" -gt 20971520 ]; then  # 20MB
                echo "  📄 清空: $logfile ($(numfmt --to=iec $size))"
                : > "$logfile"
                total_freed=$((total_freed + size))
              fi
            fi
          done

          echo ""
          echo "💾 总共释放: $(numfmt --to=iec $total_freed)"
          echo "total_freed=$total_freed" >> $GITHUB_ENV

      # ========== 4. 归档旧日志到 R2（可选）==========
      - name: Archive logs to R2
        if: env.total_freed != '' && env.total_freed != '0'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "⏭️ 未配置 R2，跳过归档"
            exit 0
          fi

          echo "📦 安装 AWS CLI..."
          pip install awscli

          # 配置 R2 凭证
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = $R2_ACCESS_KEY_ID
          aws_secret_access_key = $R2_SECRET_ACCESS_KEY
          EOF

          # 归档当前日志（如果有）
          if [ -f "live/url_changes.log" ] && [ -s "live/url_changes.log" ]; then
            timestamp=$(date +%Y%m%d_%H%M%S)
            archive_name="logs/url_changes_${timestamp}.log"

            echo "☁️ 归档到 R2: $archive_name"
            aws s3 cp "live/url_changes.log" "s3://$R2_BUCKET/$archive_name"               --endpoint-url "$R2_ENDPOINT"               --acl private

            echo "✅ 归档完成"
          fi

      # ========== 5. 提交清理结果 ==========
      - name: Commit changes
        if: steps.check-files.outputs.has_large_files == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "✅ 没有需要提交的更改"
            exit 0
          fi

          git commit -m "🧹 Auto-clean: remove/trim oversized log files ($(date +%Y-%m-%d %H:%M))"
          git push

          echo "✅ 清理结果已提交"

      # ========== 6. 仅清理模式退出 ==========
      - name: Skip deploy if clean-only
        if: github.event.inputs.clean_only == 'true'
        run: |
          echo "🛑 仅清理模式，跳过部署"
          exit 0

      # ========== 7. 安装 Node.js ==========
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ========== 8. 安装 Wrangler ==========
      - name: Install Wrangler
        run: npm install -g wrangler

      # ========== 9. 部署到 Cloudflare Pages ==========
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 开始部署到 Cloudflare Pages..."

          # 验证必要的环境变量
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ 错误: CLOUDFLARE_API_TOKEN 未设置"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ 错误: CLOUDFLARE_ACCOUNT_ID 未设置"
            exit 1
          fi

          # 部署
          wrangler pages deploy .             --project-name=${{ secrets.CF_PAGES_PROJECT_NAME || github.event.repository.name }}             --branch=${{ github.ref_name }}             --commit-hash=${{ github.sha }}

          echo "✅ 部署完成"

      # ========== 10. 验证部署 ==========
      - name: Verify deployment
        run: |
          echo "🔍 验证部署..."

          # 等待 Pages 生效
          sleep 10

          # 尝试访问影视.json
          URL="https://${{ secrets.CF_PAGES_PROJECT_NAME || github.event.repository.name }}.pages.dev/影视.json"

          echo "测试 URL: $URL"

          response=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")

          if [ "$response" = "200" ]; then
            echo "✅ 影视.json 可正常访问 (HTTP $response)"
          else
            echo "⚠️ 影视.json 返回 HTTP $response"
          fi

      # ========== 11. 发送通知（可选）==========
      - name: Send notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            exit 0
          fi

          status="${{ job.status }}"
          repo="${{ github.repository }}"
          branch="${{ github.ref_name }}"

          if [ "$status" = "success" ]; then
            message="✅ <$repo> 部署成功\n分支: $branch\n时间: $(date +%Y-%m-%d %H:%M)"
          else
            message="❌ <$repo> 部署失败\n分支: $branch\n状态: $status\n请查看 Actions 日志"
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             -d "chat_id=$TELEGRAM_CHAT_ID"             -d "text=$message"             -d "parse_mode=HTML"             -d "disable_web_page_preview=true" > /dev/null
